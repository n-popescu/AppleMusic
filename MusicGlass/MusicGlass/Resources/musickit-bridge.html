<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="apple-music-app-name" content="Lucent" />
  <meta name="apple-music-app-build" content="1.0.0" />
  <script>
    // Runs before musickit.js so it can never install its own Web Media
    // Session handlers. WKWebView wires `navigator.mediaSession` straight
    // into the system's Lock Screen / Control Center controls (the same
    // path a <video> in Safari uses), which competes with this app's native
    // MPRemoteCommandCenter setup in NowPlayingRemoteController.swift and
    // is part of why the Lock Screen offered generic seek buttons instead
    // of real previous/next track controls.
    if (window.navigator && navigator.mediaSession) {
      navigator.mediaSession.setActionHandler = function () {};
    }
  </script>
  <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"></script>
</head>
<body>
<script>
  // ---------------------------------------------------------------------
  // This page is never shown to the user. It's the hidden engine that:
  //   1. Authenticates a specific Apple Music account (independent of
  //      whatever Apple ID the device itself is signed into).
  //   2. Performs DRM playback via MusicKit JS.
  //   3. Talks to the Apple Music catalog + library REST endpoints.
  // Native SwiftUI talks to this file only through window.MusicGlassBridge
  // and receives events back via webkit.messageHandlers.musicKitEvent.
  // ---------------------------------------------------------------------

  const post = (payload) => {
    try {
      window.webkit.messageHandlers.musicKitEvent.postMessage(payload);
    } catch (e) {
      // Running outside a WKWebView (e.g. Safari testing) — ignore.
      console.log('musicKitEvent ->', payload);
    }
  };

  // MusicKit JS's authorize() opens the Apple sign-in page via window.open()
  // and expects that popup to message back via `window.opener.postMessage`
  // once done. Real WKWebView popups always have `window.opener === null` —
  // WebKit isolates them for security — so that handshake never arrives and
  // authorize()'s own promise never resolves, even once the popup shows
  // real Apple sign-in UI and the person successfully logs in.
  //
  // Rather than fight that (an earlier version of this file hijacked
  // window.open to navigate this same window instead of opening a popup —
  // that avoided the null-opener problem but traded it for a worse one: it
  // destroyed this page's entire JS context mid-flight with no reliable way
  // to know when Apple's flow actually finished, since that requires
  // guessing which URLs Apple's sign-in redirects through), this app doesn't
  // try to detect completion at all. It lets `window.open()` behave
  // normally (WKUIDelegate.createWebViewWith in MusicKitBridge.swift shows a
  // real separate popup, sharing this page's cookies/session), leaves this
  // page's own `music` instance and JS context alone and running the whole
  // time, and relies on the person tapping "Done" once they see they're
  // signed in. Native code then reloads this page fresh — MusicKit JS's own
  // `configure()` restores an existing session from the shared cookie store
  // on load, the same way it would for a returning user on a real website.

  let music = null;

  // Posts the current auth state, and — whenever authorized — also mirrors
  // the music-user-token itself so the native side can save it to the
  // Keychain (see MusicKitBridge.swift's `userTokenDidChange` case). The
  // Keychain survives an app uninstall/reinstall the way this page's own
  // cookie store doesn't, which is what lets a future cold launch skip
  // sign-in via `restoreUserToken` below instead of requiring it again.
  function postAuthState() {
    if (!music) return;
    post({ type: 'authorizationStatusDidChange', isAuthorized: music.isAuthorized });
    if (music.isAuthorized && music.musicUserToken) {
      post({ type: 'userTokenDidChange', token: music.musicUserToken });
    }
  }

  // Called once at startup, only when MusicKit's own cookie-based restore
  // left us signed out and native handed back a token it previously saved
  // to the Keychain (e.g. this is a fresh install on a device that was
  // signed in before). Setting `musicUserToken` directly isn't itself proof
  // the token is still valid — it could have been revoked on Apple's side
  // in the meantime — so this makes one cheap authenticated call before
  // trusting it, and drops it again on failure rather than leaving the app
  // thinking it's signed in when every real request would 401.
  async function restoreUserToken(token) {
    try {
      music.musicUserToken = token;
      await music.api.music('/v1/me/library/songs', { limit: 1 });
    } catch (e) {
      music.musicUserToken = null;
    }
    postAuthState();
  }

  function attachInstanceListeners(instance) {
    instance.addEventListener('authorizationStatusDidChange', postAuthState);

    instance.addEventListener('nowPlayingItemDidChange', () => {
      const item = instance.nowPlayingItem;
      if (!item) return;
      const artworkURL = item.artworkURL
        ? item.artworkURL
        : (item.attributes && item.attributes.artwork
            ? item.attributes.artwork.url.replace('{w}', '600').replace('{h}', '600')
            : null);
      post({
        type: 'nowPlayingItemDidChange',
        item: {
          title: item.title || (item.attributes && item.attributes.name) || '',
          artistName: item.artistName || (item.attributes && item.attributes.artistName) || '',
          albumName: item.albumName || (item.attributes && item.attributes.albumName) || '',
          artworkURL: artworkURL,
          durationSeconds: item.playbackDuration || 0,
          currentTimeSeconds: currentPlaybackTime(),
          catalogID: item.id || null
        }
      });
    });

    instance.addEventListener('playbackStateDidChange', (e) => {
      post({ type: 'playbackStateDidChange', state: e.state });
    });

    instance.addEventListener('playbackTimeDidChange', () => {
      post({
        type: 'playbackTimeDidChange',
        currentTime: currentPlaybackTime(),
        duration: currentPlaybackDuration()
      });
    });
  }

  // MusicKit JS doesn't fire a dedicated event when shuffle/repeat/volume
  // change (they're plain properties, not observable), so the bridge posts a
  // fresh snapshot itself right after every setter call below, plus once on
  // `ready` so native starts in sync.
  function postPlaybackModes() {
    if (!music) return;
    post({
      type: 'playbackModesDidChange',
      shuffleMode: typeof music.shuffleMode === 'number' ? music.shuffleMode : 0,
      repeatMode: typeof music.repeatMode === 'number' ? music.repeatMode : 0,
      volume: currentVolume()
    });
  }

  // MusicKit JS has carried player volume at `music.player.volume` in some
  // releases and directly at `music.volume` in others; read/write defensively
  // through whichever is present.
  function currentVolume() {
    if (music.player && typeof music.player.volume === 'number') return music.player.volume;
    if (typeof music.volume === 'number') return music.volume;
    return 1;
  }
  function applyVolume(value) {
    if (music.player && 'volume' in music.player) {
      music.player.volume = value;
    } else {
      music.volume = value;
    }
  }

  // Same version inconsistency as volume above: real-world MusicKit JS usage
  // (and the community-maintained MusicKit.Player.d.ts) shows
  // currentPlaybackTime/currentPlaybackDuration living on `music.player`,
  // not `music` directly — but this file used to read them straight off
  // `instance`/`m` everywhere, which is `undefined` if that's not actually
  // where this MusicKit JS release puts them. That's the real reason the
  // in-app progress bar only ever seemed to update at pause: `undefined || 0`
  // silently became a constant 0 on every playbackTimeDidChange tick, and
  // the only genuinely correct-looking update came from wherever else in
  // the app happened to recompute state around a pause/play transition.
  function currentPlaybackTime() {
    if (music.player && typeof music.player.currentPlaybackTime === 'number') return music.player.currentPlaybackTime;
    if (typeof music.currentPlaybackTime === 'number') return music.currentPlaybackTime;
    return 0;
  }
  function currentPlaybackDuration() {
    if (music.player && typeof music.player.currentPlaybackDuration === 'number') return music.player.currentPlaybackDuration;
    if (typeof music.currentPlaybackDuration === 'number') return music.currentPlaybackDuration;
    return 0;
  }

  // Apple's own forum answer for removing a queue item reads the queue as
  // `MusicKit.getInstance().player.queue`, while this file has always used
  // `music.queue`. That's the identical `music` vs `music.player` split that
  // made the progress bar look broken until currentPlaybackTime() above got a
  // dual path, so the queue gets one too rather than betting on either.
  function queueObject() {
    if (music && music.queue && Array.isArray(music.queue.items)) return music.queue;
    if (music && music.player && music.player.queue && Array.isArray(music.player.queue.items)) return music.player.queue;
    return (music && music.queue) || (music && music.player && music.player.queue) || null;
  }

  document.addEventListener('musickitloaded', async () => {
    try {
      await MusicKit.configure({
        developerToken: window.MUSICGLASS_DEVELOPER_TOKEN,
        app: { name: 'Lucent', build: '1.0.0' }
      });
      music = MusicKit.getInstance();
      attachInstanceListeners(music);
      post({ type: 'ready' });
      if (!music.isAuthorized && window.MUSICGLASS_STORED_USER_TOKEN) {
        await restoreUserToken(window.MUSICGLASS_STORED_USER_TOKEN);
      } else {
        postAuthState();
      }
      postPlaybackModes();
    } catch (err) {
      post({ type: 'error', message: 'MusicKit configure failed: ' + err.message });
    }
  });

  function requireMusic() {
    if (!music) throw new Error('MusicKit is not configured yet.');
    return music;
  }

  // Apple's own `playParams.isLibrary` (when present) is authoritative for
  // *that specific item* and can legitimately disagree with the `isLibrary`
  // this was fetched under — e.g. a library playlist can contain tracks
  // added straight from the catalog, which come back with
  // `playParams.isLibrary: false` even though the playlist itself is a
  // library one. Forcing every item to the parent's isLibrary (the previous
  // behavior) could build a `{ librarySong: <catalog id> }` queue
  // descriptor for such a track, which is exactly the shape of thing that
  // throws inside MusicKit JS's setQueue — surfacing natively as a bare "A
  // JavaScript exception occurred" with tapping a song, or a playlist's
  // Play/shuffle buttons, appearing to do nothing.
  function resolveIsLibrary(a, fallback) {
    return a.playParams && typeof a.playParams.isLibrary === 'boolean' ? a.playParams.isLibrary : !!fallback;
  }

  function mapSongAttributes(id, a, isLibrary) {
    return {
      id: id,
      // `name`/`artistName` decode into non-optional Swift Strings
      // (Song.title/artistName) — a real catalog item genuinely missing one
      // of these (confirmed via a "Key 'artistName' not found" decode error
      // 447 items into a real fetch) means the resulting object has no key
      // for it at all, which fails decoding the *entire* array natively,
      // not just that one item — mapSafely's per-item try/catch can't catch
      // this since building the object literal itself never throws.
      name: a.name || '',
      artistName: a.artistName || '',
      albumName: a.albumName || null,
      durationInMillis: a.durationInMillis || null,
      artwork: a.artwork ? { width: a.artwork.width, height: a.artwork.height, url: a.artwork.url } : null,
      releaseDate: a.releaseDate || null,
      playParams: a.playParams
        ? { id: a.playParams.id, kind: a.playParams.kind, isLibrary: resolveIsLibrary(a, isLibrary) }
        : { id: id, kind: 'song', isLibrary: !!isLibrary }
    };
  }

  function mapAlbumAttributes(id, a, isLibrary) {
    return {
      id: id,
      // See mapSongAttributes above for why these can't be left undefined.
      name: a.name || '',
      artistName: a.artistName || '',
      artwork: a.artwork ? { width: a.artwork.width, height: a.artwork.height, url: a.artwork.url } : null,
      trackCount: a.trackCount || null,
      releaseDate: a.releaseDate || null,
      playParams: a.playParams
        ? { id: a.playParams.id, kind: a.playParams.kind, isLibrary: resolveIsLibrary(a, isLibrary) }
        : { id: id, kind: 'album', isLibrary: !!isLibrary }
    };
  }

  // Maps a *queue* item, which MusicKit JS represents as a `MediaItem`
  // instance rather than a raw catalog/library attributes payload — most
  // fields live directly on the item, with `.attributes` only present in
  // some MusicKit JS versions as a fallback.
  function mapQueueItem(item) {
    const attrs = item.attributes || {};
    const artwork = item.artwork || attrs.artwork;
    // Live radio stations report `playbackDuration === Infinity`, which
    // bridges to the native side as a JS Infinity value that later crashes
    // NSJSONSerialization outright (see MusicKitBridge.swift's `call<T>` and
    // `nowPlayingItemDidChange`) — finite-check it here at the source rather
    // than relying only on the native-side guard.
    const computedDuration = item.playbackDuration && isFinite(item.playbackDuration)
      ? Math.round(item.playbackDuration * 1000)
      : null;
    return {
      id: item.id || attrs.id || '',
      name: item.title || attrs.name || '',
      artistName: item.artistName || attrs.artistName || '',
      albumName: item.albumName || attrs.albumName || null,
      artwork: artwork ? { width: artwork.width, height: artwork.height, url: artwork.url } : null,
      durationInMillis: computedDuration || attrs.durationInMillis || null
    };
  }

  function mapStationAttributes(id, a) {
    return {
      id: id,
      // See mapSongAttributes above for why this can't be left undefined.
      name: a.name || '',
      artwork: a.artwork ? { width: a.artwork.width, height: a.artwork.height, url: a.artwork.url } : null,
      isLive: !!a.isLive,
      tagline: (a.editorialNotes && (a.editorialNotes.tagline || a.editorialNotes.short)) || null,
      playParams: a.playParams
        ? { id: a.playParams.id, kind: a.playParams.kind || 'station', isLibrary: false }
        : { id: id, kind: 'station', isLibrary: false }
    };
  }

  function mapArtistAttributes(id, a) {
    return {
      id: id,
      // See mapSongAttributes above for why this can't be left undefined.
      name: a.name || '',
      artwork: a.artwork ? { width: a.artwork.width, height: a.artwork.height, url: a.artwork.url } : null
    };
  }

  function mapPlaylistAttributes(id, a, isLibrary) {
    return {
      id: id,
      // See mapSongAttributes above for why this can't be left undefined.
      name: a.name || '',
      curatorName: a.curatorName || null,
      artwork: a.artwork ? { width: a.artwork.width, height: a.artwork.height, url: a.artwork.url } : null,
      trackCount: a.trackCount || null,
      description: a.description ? (a.description.standard || a.description.short || null) : null,
      playParams: a.playParams
        ? { id: a.playParams.id, kind: a.playParams.kind, isLibrary: resolveIsLibrary(a, isLibrary) }
        : { id: id, kind: 'playlist', isLibrary: !!isLibrary }
    };
  }

  // Maps an array item-by-item, skipping (and reporting) any single item
  // whose mapping function throws instead of letting one malformed entry
  // reject the whole array. `label` is just for the posted error message.
  function mapSafely(items, mapFn, label) {
    const out = [];
    items.forEach(item => {
      try {
        out.push(mapFn(item));
      } catch (e) {
        post({ type: 'error', message: 'Skipped a malformed ' + label + ': ' + e.message });
      }
    });
    return out;
  }

  // Every library/track/artist-albums fetch used to request a single page
  // (limit: 50/100, whichever the endpoint's max is) and stop there, so
  // anyone with more items than that page size silently only ever saw the
  // first page — no error, just a truncated list. Apple's API returns a
  // `next` field (a ready-to-use path with its own offset/limit baked in)
  // whenever more results exist; this follows it until exhausted. Capped at
  // 20 pages (2000 items at limit 100) as a sanity bound, not a real limit
  // anyone is likely to hit.
  async function fetchAllPages(m, path, params) {
    let all = [];
    let nextPath = path;
    let nextParams = params;
    for (let page = 0; page < 20; page++) {
      const res = await m.api.music(nextPath, nextParams);
      all = all.concat(res.data.data || []);
      if (!res.data.next) break;
      nextPath = res.data.next;
      nextParams = undefined;
    }
    return all;
  }

  // Client-side fallback used by playNext/playLater when MusicKit JS's own
  // `playNext`/`playLater` aren't available: rebuilds the queue array with
  // the new item spliced in either right after the current track ('next') or
  // at the end ('later'), same rebuild-and-resume approach as
  // `moveQueueItem`.
  // `SetQueueOptions.items` takes an array of `descriptor` — verified
  // (wsmd/musickit-typescript, same source used for setQueueAndPlay's fix
  // above) to mean "a MusicKit.MediaItem instance, or a plain string id",
  // never an `{id, kind}`-shaped object. That's what this used to build,
  // which is the same class of bug as setQueueAndPlay's fabricated
  // `library*` keys — a shape `setQueue` has never recognized, so this
  // fallback path (only reached when MusicKit JS's own playNext/playLater
  // are missing or throw) likely never actually worked either.
  async function insertIntoQueueFallback(id, position) {
    const m = requireMusic();
    const q = m.queue;
    const items = (q && q.items) ? q.items.map(i => i.id) : [];
    const wasPlayingIndex = (q && typeof q.position === 'number') ? q.position : -1;
    const currentlyPlayingId = (q && q.items && wasPlayingIndex >= 0 && wasPlayingIndex < q.items.length)
      ? q.items[wasPlayingIndex].id
      : null;

    const insertAt = position === 'next' ? Math.min(wasPlayingIndex + 1, items.length) : items.length;
    items.splice(Math.max(insertAt, 0), 0, id);

    await m.setQueue({ items: items });

    if (currentlyPlayingId) {
      const newIndex = items.indexOf(currentlyPlayingId);
      if (newIndex >= 0) {
        await m.changeToMediaAtIndex(newIndex);
      }
    }
  }

  window.MusicGlassBridge = {

    // ---- Auth ----
    // Opens Apple's own music.apple.com sign-in popup/window. The account
    // that logs in here is completely independent of the device's system
    // Apple ID / Media & Purchases account.
    authorize: async function () {
      const m = requireMusic();
      await m.authorize();
    },

    unauthorize: async function () {
      const m = requireMusic();
      await m.unauthorize();
    },

    // ---- Playback ----
    play: async function () { await requireMusic().play(); },
    pause: async function () { await requireMusic().pause(); },
    skipToNext: async function () { await requireMusic().skipToNextItem(); },
    skipToPrevious: async function () { await requireMusic().skipToPreviousItem(); },
    seek: async function (seconds) { requireMusic().seekToTime(seconds); },

    // Read synchronously on demand rather than relied on only via the
    // `playbackTimeDidChange` event above — see MusicKitBridge.swift's
    // playback-time polling loop for why: that event is driven by an
    // internal MusicKit JS timer, and WebKit throttles a hidden page's own
    // JS timers/requestAnimationFrame independently of whether the app
    // itself is in the foreground, so it can go long stretches without
    // firing. A one-off call like this one isn't a self-scheduled JS timer,
    // so it isn't subject to that same throttling.
    getPlaybackTime: async function () {
      requireMusic();
      const t = currentPlaybackTime();
      const d = currentPlaybackDuration();
      return {
        currentTime: isFinite(t) ? t : 0,
        duration: isFinite(d) ? d : 0
      };
    },

    // `isLibrary` isn't used here at all — see the comment below for why.
    // It's still accepted (and ignored) so every call site doesn't need to
    // change.
    setQueueAndPlay: async function (id, kind, isLibrary) {
      const m = requireMusic();
      const descriptor = {};
      if (kind === 'station' || kind === 'radioStation') {
        // MusicKit JS's SetQueueOptions takes a single station id under
        // `station` — stations always play from the catalog, never the
        // library. Apple's own live radio stations report their playParams
        // kind as `radioStation` rather than `station` (see the response
        // sample in "Get the Apple Music Live Radio Stations"), so both
        // spellings have to land on the same `station` key — otherwise
        // tapping Apple Music 1 builds a `radioStation` key setQueue has
        // never heard of and silently does nothing.
        descriptor.station = id;
      } else {
        // MusicKit JS's real SetQueueOptions type (verified against
        // wsmd/musickit-typescript's MusicKit.SetQueueOptions.d.ts, since
        // Apple's own online docs 404 for this exact type) has exactly one
        // key per kind — `song`, `album`, `playlist` — with NO
        // `library`-prefixed variants at all. MusicKit JS resolves library
        // vs. catalog internally from the id itself; the caller always uses
        // the same plain key either way. This code used to fabricate a
        // `libraryPlaylist`/`libraryAlbum`/`librarySong` key for library
        // items — a key `setQueue` has never recognized — which is the
        // actual reason playing a library playlist, or a song from one, did
        // nothing (or surfaced as a bare "A JavaScript exception occurred"):
        // the resulting descriptor had no key `setQueue` understood at all.
        descriptor[kind] = id;
      }
      // `startPlaying: true` makes setQueue begin playback as part of
      // building the queue instead of as a second, separately-awaited step.
      // The old `setQueue(...)` then `play()` pair meant two sequential
      // round trips: MusicKit resolves the descriptor against
      // api.music.apple.com, and only once that has fully settled does
      // play() start fetching the stream manifest and licence. Folding them
      // together lets MusicKit overlap that work, which is the single
      // biggest win available on tap-to-first-audio from this side of the
      // bridge. (`autoplay` is the deprecated v2 spelling; `startPlaying` is
      // the v3 one.)
      descriptor.startPlaying = true;
      await m.setQueue(descriptor);

      // Belt and braces: if this MusicKit build ignored startPlaying, we'd
      // otherwise silently end up with a queue set and nothing playing.
      if (!(m.isPlaying === true || m.playbackState === 2)) {
        try { await m.play(); } catch (e) {}
      }
    },

    // ---- Shuffle / Repeat / Volume ----
    setShuffleMode: async function (mode) {
      const m = requireMusic();
      m.shuffleMode = mode;
      postPlaybackModes();
    },

    setRepeatMode: async function (mode) {
      const m = requireMusic();
      m.repeatMode = mode;
      postPlaybackModes();
    },

    setVolume: async function (value) {
      requireMusic();
      applyVolume(value);
      postPlaybackModes();
    },

    // ---- Play Next / Play Later ----
    // MusicKit JS's documented `music.playNext(descriptor)` /
    // `music.playLater(descriptor)` insert into the live queue without
    // rebuilding it. Both are used when present; since this project can't be
    // verified against a live MusicKit JS release, a client-side fallback
    // (same rebuild-the-array approach as `moveQueueItem`) covers releases
    // where they're missing or throw.
    // Same descriptor shape as setQueueAndPlay above — no `library`-prefixed
    // keys exist in MusicKit JS's SetQueueOptions, so playNext/playLater
    // take the same plain `song`/`album`/`playlist` key regardless of
    // isLibrary (see setQueueAndPlay's comment for how this was verified).
    playNext: async function (id, kind, isLibrary) {
      const m = requireMusic();
      const descriptor = {};
      descriptor[kind] = id;
      if (typeof m.playNext === 'function') {
        try {
          await m.playNext(descriptor);
          return;
        } catch (e) {
          // Fall through to the client-side fallback below.
        }
      }
      await insertIntoQueueFallback(id, 'next');
    },

    playLater: async function (id, kind, isLibrary) {
      const m = requireMusic();
      const descriptor = {};
      descriptor[kind] = id;
      if (typeof m.playLater === 'function') {
        try {
          await m.playLater(descriptor);
          return;
        } catch (e) {
          // Fall through to the client-side fallback below.
        }
      }
      await insertIntoQueueFallback(id, 'later');
    },

    // ---- Ratings (love/dislike) ----
    // Apple Music REST: PUT .../v1/me/ratings/{type}/{id} with
    // { attributes: { value: 1 } } for love, -1 for dislike; DELETE removes it.
    // Apple's documented request body for this endpoint is
    // {"type":"rating","attributes":{"value":...}} — the top-level "type"
    // is required (this is a JSON:API-shaped body), and was missing here
    // entirely, which very plausibly made every Love/Dislike tap 400 rather
    // than actually set a rating.
    setRating: async function (id, kind, value) {
      const m = requireMusic();
      await m.api.music(`/v1/me/ratings/${kind}s/${id}`, {}, {
        fetchOptions: { method: 'PUT', body: JSON.stringify({ type: 'rating', attributes: { value: value } }) }
      });
    },

    removeRating: async function (id, kind) {
      const m = requireMusic();
      await m.api.music(`/v1/me/ratings/${kind}s/${id}`, {}, { fetchOptions: { method: 'DELETE' } });
    },

    // ---- Add to Library ----
    // POST .../v1/me/library?ids[songs]=... (or albums/playlists) adds a
    // catalog item to the signed-in account's library.
    addToLibrary: async function (id, kind) {
      const m = requireMusic();
      await m.api.music('/v1/me/library', { [`ids[${kind}s]`]: id }, { fetchOptions: { method: 'POST' } });
    },

    // ---- Playlist create/edit ----
    // A library song's ID lives in a different namespace than a catalog
    // song's, and Apple's API needs the relationship `type` to match which
    // one it actually is ('library-songs' vs 'songs') — using the wrong one
    // for a given ID silently fails to add the track (or errors outright).
    createPlaylist: async function (name, description, trackIds, isLibrary) {
      const m = requireMusic();
      const trackType = isLibrary ? 'library-songs' : 'songs';
      const attributes = { name: name };
      if (description) attributes.description = description;
      const body = { attributes: attributes };
      if (trackIds && trackIds.length) {
        body.relationships = { tracks: { data: trackIds.map(id => ({ id: id, type: trackType })) } };
      }
      const res = await m.api.music('/v1/me/library/playlists', {}, {
        fetchOptions: { method: 'POST', body: JSON.stringify(body) }
      });
      const d = (res.data.data || [])[0];
      if (d) {
        return mapPlaylistAttributes(d.id, d.attributes || attributes, true);
      }
      // Some MusicKit JS versions return an empty body on 201; degrade gracefully.
      return { id: '', name: name, curatorName: null, artwork: null, trackCount: (trackIds || []).length, description: description || null, playParams: null };
    },

    addTracksToPlaylist: async function (playlistId, trackIds, isLibrary) {
      const m = requireMusic();
      const trackType = isLibrary ? 'library-songs' : 'songs';
      const body = { data: trackIds.map(id => ({ id: id, type: trackType })) };
      await m.api.music(`/v1/me/library/playlists/${playlistId}/tracks`, {}, {
        fetchOptions: { method: 'POST', body: JSON.stringify(body) }
      });
    },

    // ---- Real recently played history ----
    fetchRecentlyPlayed: async function () {
      const m = requireMusic();
      const res = await m.api.music('/v1/me/recent/played', { limit: 30 });
      const data = res.data.data || [];
      // Same per-item isolation as mapSafely elsewhere in this file — a raw
      // .map() here meant one malformed item (e.g. missing an attribute one
      // of the map*Attributes functions reads directly) rejected this
      // entire list instead of just that one entry.
      const items = [];
      data.forEach(d => {
        try {
          const isLibraryType = typeof d.type === 'string' && d.type.startsWith('library-');
          if (d.type === 'songs' || d.type === 'library-songs') {
            items.push({ kind: 'song', song: mapSongAttributes(d.id, d.attributes, isLibraryType), album: null, playlist: null });
          } else if (d.type === 'albums' || d.type === 'library-albums') {
            items.push({ kind: 'album', song: null, album: mapAlbumAttributes(d.id, d.attributes, isLibraryType), playlist: null });
          } else if (d.type === 'playlists' || d.type === 'library-playlists') {
            items.push({ kind: 'playlist', song: null, album: null, playlist: mapPlaylistAttributes(d.id, d.attributes, isLibraryType) });
          }
          // else: e.g. stations — not modeled in the "recently played" UI.
        } catch (e) {
          post({ type: 'error', message: 'Skipped a malformed recently-played item: ' + e.message });
        }
      });
      return items;
    },

    // ---- Discovery ----
    //
    // These three responses are the first real place personal/catalog data
    // actually flows through `mapAlbumAttributes`/`mapSongAttributes`/etc.
    // with a signed-in account (fetchLibrary* and search were exercised
    // earlier in this project's life; fetchRecommendations/fetchCharts/
    // fetchStations were not, since Discover used to skip calling the bridge
    // at all while signed out). If a single item's `.attributes` is missing
    // a field these mapping functions read directly (rather than defensively
    // with `? :`/`||`), that throws inside `.map()`/`.forEach()` and rejects
    // the *entire* array for every item, not just the bad one. mapSafely
    // below isolates each item so one malformed entry can't take out the
    // whole list — and, as importantly, means a bad item now surfaces as a
    // 'error' event (visible in the Settings screen's error banner) instead
    // of an opaque failure with nothing to go on.
    fetchRecommendations: async function () {
      const m = requireMusic();
      const res = await m.api.music('/v1/me/recommendations', { limit: 10 });
      const data = res.data.data || [];
      const items = [];
      data.forEach(rec => {
        const contents = (rec.relationships && rec.relationships.contents && rec.relationships.contents.data) || [];
        contents.forEach(c => {
          try {
            if (c.type === 'albums') {
              items.push({ kind: 'album', album: mapAlbumAttributes(c.id, c.attributes, false), playlist: null });
            } else if (c.type === 'playlists') {
              items.push({ kind: 'playlist', album: null, playlist: mapPlaylistAttributes(c.id, c.attributes, false) });
            }
          } catch (e) {
            post({ type: 'error', message: 'Skipped a malformed recommendation item: ' + e.message });
          }
        });
      });
      return items;
    },

    fetchCharts: async function () {
      const m = requireMusic();
      const storefront = m.storefrontId || 'us';
      const res = await m.api.music(`/v1/catalog/${storefront}/charts`, { types: 'songs,albums', limit: 20 });
      const results = res.data.results || {};
      const songsChart = (results.songs && results.songs[0] && results.songs[0].data) || [];
      const albumsChart = (results.albums && results.albums[0] && results.albums[0].data) || [];
      return {
        songs: mapSafely(songsChart, d => mapSongAttributes(d.id, d.attributes, false), 'chart song'),
        albums: mapSafely(albumsChart, d => mapAlbumAttributes(d.id, d.attributes, false), 'chart album')
      };
    },

    // `/v1/catalog/{sf}/stations` is NOT a listing endpoint. It has exactly
    // three valid modes — `ids=`, `filter[identity]=personal`, and
    // `filter[featured]=apple-music-live-radio` — and this used to call it
    // with neither, just `limit: 20`. That's a 4xx every single time, which
    // refreshDiscover's per-section `catch` swallowed, so Radio was
    // guaranteed to be empty and guaranteed to say nothing about why.
    //
    // Both real modes are fetched independently so one failing (a storefront
    // with no live radio, a user with no personal station yet) still leaves
    // the other showing.
    fetchStations: async function () {
      const m = requireMusic();
      const storefront = m.storefrontId || 'us';
      let live = [];
      let personal = [];

      try {
        const res = await m.api.music(`/v1/catalog/${storefront}/stations`, {
          'filter[featured]': 'apple-music-live-radio'
        });
        live = mapSafely(res.data.data || [], d => mapStationAttributes(d.id, d.attributes), 'live station');
      } catch (e) {}

      try {
        const res = await m.api.music(`/v1/catalog/${storefront}/stations`, {
          'filter[identity]': 'personal'
        });
        personal = mapSafely(res.data.data || [], d => mapStationAttributes(d.id, d.attributes), 'personal station');
      } catch (e) {}

      // De-duplicate: the personal station can also come back under featured
      // in some storefronts.
      const seen = {};
      return live.concat(personal).filter(st => {
        if (seen[st.id]) return false;
        seen[st.id] = true;
        return true;
      });
    },

    // ---- Song relations (context menu: go to album / artist) ----
    //
    // Songs expose `albums` and `artists` relationships; this resolves both
    // in one bridge round trip so a long-press menu doesn't need two.
    // Everything is individually try/caught and the result is always an
    // object, because a library-only song's id isn't in the catalog id space
    // and will legitimately 404 here.
    fetchSongRelations: async function (songId) {
      const m = requireMusic();
      const storefront = m.storefrontId || 'us';
      let album = null;
      let artist = null;

      try {
        const res = await m.api.music(`/v1/catalog/${storefront}/songs/${songId}/albums`, { limit: 1 });
        const data = (res && res.data && res.data.data) || [];
        if (data.length) album = mapAlbumAttributes(data[0].id, data[0].attributes || {}, false);
      } catch (e) {}

      try {
        const res = await m.api.music(`/v1/catalog/${storefront}/songs/${songId}/artists`, { limit: 1 });
        const data = (res && res.data && res.data.data) || [];
        if (data.length) artist = mapArtistAttributes(data[0].id, data[0].attributes || {});
      } catch (e) {}

      return { album: album, artist: artist };
    },

    // ---- Autoplay seed ----
    //
    // Apple exposes a `station` relationship on both songs and artists
    // (Songs.Relationships.SongsStationRelationship /
    // ArtistsStationRelationship). That station is the same thing the native
    // Music app creates from "Create Station" on a track: a personalised,
    // endless stream seeded from that specific song, which is what actually
    // continues in the same vein rather than jumping to whatever is charting.
    //
    // This replaces autoplay's old behaviour of grabbing a random top-100
    // song, which had no relationship to what had just been playing.
    //
    // Returns null (not an error) whenever no station can be derived — a
    // library-only track whose id isn't in the catalog id space, a storefront
    // without one, an artist with no station — so the native side can fall
    // back rather than surfacing a failure for something the person never
    // explicitly asked for.
    fetchAutoplayStation: async function (songId) {
      const m = requireMusic();
      const storefront = m.storefrontId || 'us';

      async function stationFrom(path) {
        try {
          const res = await m.api.music(path, { limit: 1 });
          const data = (res && res.data && res.data.data) || [];
          if (!data.length) return null;
          return mapStationAttributes(data[0].id, data[0].attributes || {});
        } catch (e) {
          return null;
        }
      }

      // 1. The song's own station — the tightest match available.
      const fromSong = await stationFrom(`/v1/catalog/${storefront}/songs/${songId}/station`);
      if (fromSong) return { station: fromSong };

      // 2. Failing that, the primary artist's station. Still far closer to
      //    "more like this" than a chart.
      try {
        const artistsRes = await m.api.music(`/v1/catalog/${storefront}/songs/${songId}/artists`, { limit: 1 });
        const artists = (artistsRes && artistsRes.data && artistsRes.data.data) || [];
        if (artists.length) {
          const fromArtist = await stationFrom(`/v1/catalog/${storefront}/artists/${artists[0].id}/station`);
          if (fromArtist) return { station: fromArtist };
        }
      } catch (e) {}

      // Always an object, never a bare null: `call<T>` on the native side
      // rejects a top-level null outright (isValidJSONObject), which would
      // turn "no station exists" into a decode error.
      return { station: null };
    },

    // ---- Search hints/autocomplete ----
    fetchSearchHints: async function (term) {
      const m = requireMusic();
      const storefront = m.storefrontId || 'us';
      const res = await m.api.music(`/v1/catalog/${storefront}/search/hints`, { term: term });
      return (res.data.results && res.data.results.terms) || [];
    },

    // ---- Library ----
    fetchLibraryPlaylists: async function () {
      const m = requireMusic();
      const data = await fetchAllPages(m, '/v1/me/library/playlists', { limit: 100 });
      return mapSafely(data, d => mapPlaylistAttributes(d.id, d.attributes, true), 'library playlist');
    },

    fetchLibraryAlbums: async function () {
      const m = requireMusic();
      const data = await fetchAllPages(m, '/v1/me/library/albums', { limit: 100 });
      return mapSafely(data, d => mapAlbumAttributes(d.id, d.attributes, true), 'library album');
    },

    fetchLibraryArtists: async function () {
      const m = requireMusic();
      const data = await fetchAllPages(m, '/v1/me/library/artists', { limit: 100 });
      return mapSafely(data, d => mapArtistAttributes(d.id, d.attributes), 'library artist');
    },

    fetchLibrarySongs: async function () {
      const m = requireMusic();
      const data = await fetchAllPages(m, '/v1/me/library/songs', { limit: 100 });
      return mapSafely(data, d => mapSongAttributes(d.id, d.attributes, true), 'library song');
    },

    // isLibrary picks the right endpoint: a catalog album/playlist (e.g. from
    // search results) has no /v1/me/library/... resource, so this must not
    // be hardcoded to the library path the way it used to be.
    fetchPlaylistTracks: async function (id, isLibrary) {
      const m = requireMusic();
      const path = isLibrary
        ? `/v1/me/library/playlists/${id}/tracks`
        : `/v1/catalog/${m.storefrontId || 'us'}/playlists/${id}/tracks`;
      const data = await fetchAllPages(m, path, { limit: 100 });
      return mapSafely(data, d => mapSongAttributes(d.id, d.attributes, !!isLibrary), 'playlist track');
    },

    fetchAlbumTracks: async function (id, isLibrary) {
      const m = requireMusic();
      const path = isLibrary
        ? `/v1/me/library/albums/${id}/tracks`
        : `/v1/catalog/${m.storefrontId || 'us'}/albums/${id}/tracks`;
      const data = await fetchAllPages(m, path, { limit: 100 });
      return mapSafely(data, d => mapSongAttributes(d.id, d.attributes, !!isLibrary), 'album track');
    },

    // Catalog-only: works for any artist ID with the artist's catalog albums.
    // Library artists (from fetchLibraryArtists) don't carry a usable catalog
    // ID for this, so this is only wired up from catalog search results.
    fetchArtistAlbums: async function (id) {
      const m = requireMusic();
      const storefront = m.storefrontId || 'us';
      const data = await fetchAllPages(m, `/v1/catalog/${storefront}/artists/${id}/albums`, { limit: 50 });
      return mapSafely(data, d => mapAlbumAttributes(d.id, d.attributes, false), 'artist album');
    },

    // ---- Queue (Up Next) ----
    // MusicKit JS keeps the live playback queue on `music.queue`. `.items` is
    // an array of MediaItem, `.position` is the index currently playing.
    fetchQueue: async function () {
      requireMusic();
      const q = queueObject();
      const items = (q && q.items) ? q.items : [];
      return {
        position: (q && typeof q.position === 'number') ? q.position : -1,
        items: items.map(mapQueueItem)
      };
    },

    jumpToQueueItem: async function (index) {
      const m = requireMusic();
      // `changeToMediaAtIndex` is MusicKit JS's public API for jumping within
      // the current queue without rebuilding it.
      await m.changeToMediaAtIndex(index);
    },

    // Rebuilding the queue is the only way to reorder it (MusicKit JS still
    // publishes no "move item" API), and rebuilding stops playback — so
    // capture where we are first and restore it afterwards, otherwise every
    // reorder restarts the current track from 0:00.
    //
    // The old version passed `items.map(i => i.id)` — bare id strings. That is
    // the same mistake as the fabricated `librarySong` descriptors fixed
    // earlier: a bare string gives setQueue no way to know what kind of thing
    // it is, so the call throws, the native side catches it and re-reads the
    // untouched queue, and the row visibly snaps back. The MediaItem objects
    // already in `q.items` are themselves valid descriptors and carry their
    // own type, so they're passed through as-is.
    moveQueueItem: async function (from, to) {
      const m = requireMusic();
      const q = queueObject();
      if (!q || !q.items || from < 0 || from >= q.items.length) return { moved: false };

      const items = q.items.slice();
      const [moved] = items.splice(from, 1);
      items.splice(Math.max(0, Math.min(to, items.length)), 0, moved);

      const wasPlayingIndex = (typeof q.position === 'number') ? q.position : -1;
      const currentItem = (wasPlayingIndex >= 0 && wasPlayingIndex < q.items.length)
        ? q.items[wasPlayingIndex]
        : null;
      const resumeAt = currentPlaybackTime();
      const wasPlaying = m.isPlaying === true || m.playbackState === 2;

      await m.setQueue({ items: items });

      if (currentItem) {
        const newIndex = items.findIndex(i => i.id === currentItem.id);
        if (newIndex >= 0) {
          await m.changeToMediaAtIndex(newIndex);
          // Put the needle back where it was. Without this the reorder is
          // technically correct and still feels broken, because the song
          // you're listening to jumps back to the beginning.
          if (resumeAt > 1) {
            try { await m.seekToTime(resumeAt); } catch (e) {}
          }
          if (wasPlaying) {
            try { await m.play(); } catch (e) {}
          }
        }
      }
      return { moved: true };
    },

    // `MusicKit.Queue.remove(index)` has existed since MusicKit JS build 129
    // (per Apple's own forum answer). It mutates the live queue in place, so
    // unlike a reorder there's no rebuild and no playback interruption at all
    // — worth preferring even though the setQueue fallback below would also
    // produce the right list.
    removeQueueItem: async function (index) {
      const m = requireMusic();
      const q = queueObject();
      if (!q || !q.items || index < 0 || index >= q.items.length) return { removed: false };

      if (typeof q.remove === 'function') {
        q.remove(index);
        return { removed: true, viaNativeRemove: true };
      }

      // Older build: rebuild without the removed item, same descriptor rules
      // (and the same resume handling) as moveQueueItem above.
      const items = q.items.slice();
      items.splice(index, 1);

      const wasPlayingIndex = (typeof q.position === 'number') ? q.position : -1;
      const removingCurrent = index === wasPlayingIndex;
      const currentItem = (!removingCurrent && wasPlayingIndex >= 0 && wasPlayingIndex < q.items.length)
        ? q.items[wasPlayingIndex]
        : null;
      const resumeAt = currentPlaybackTime();
      const wasPlaying = m.isPlaying === true || m.playbackState === 2;

      await m.setQueue({ items: items });

      if (currentItem) {
        const newIndex = items.findIndex(i => i.id === currentItem.id);
        if (newIndex >= 0) {
          await m.changeToMediaAtIndex(newIndex);
          if (resumeAt > 1) {
            try { await m.seekToTime(resumeAt); } catch (e) {}
          }
          if (wasPlaying) {
            try { await m.play(); } catch (e) {}
          }
        }
      }
      return { removed: true, viaNativeRemove: false };
    },

    // ---- Search (catalog) ----
    // Apple's search endpoint caps each category at 25 results per request
    // (`limit`), same as any other paged endpoint — the first page was all
    // this ever fetched, so a broad term always looked artificially capped.
    // Each category's result object independently reports its own `next`
    // (with its own offset baked in) even from this one combined request, so
    // that's used here purely as a "is there more" flag; the actual next
    // page for one category is fetched via the searchMore* functions below,
    // scoped to just that type, when the person actually scrolls that far.
    search: async function (term) {
      const m = requireMusic();
      const storefront = m.storefrontId || 'us';
      const res = await m.api.music(`/v1/catalog/${storefront}/search`, {
        term: term,
        types: 'songs,albums,artists,playlists',
        limit: 25
      });
      const results = res.data.results || {};
      return {
        songs: mapSafely(results.songs ? results.songs.data : [], d => mapSongAttributes(d.id, d.attributes, false), 'search song'),
        albums: mapSafely(results.albums ? results.albums.data : [], d => mapAlbumAttributes(d.id, d.attributes, false), 'search album'),
        artists: mapSafely(results.artists ? results.artists.data : [], d => mapArtistAttributes(d.id, d.attributes), 'search artist'),
        playlists: mapSafely(results.playlists ? results.playlists.data : [], d => mapPlaylistAttributes(d.id, d.attributes, false), 'search playlist'),
        hasMoreSongs: !!(results.songs && results.songs.next),
        hasMoreAlbums: !!(results.albums && results.albums.next),
        hasMoreArtists: !!(results.artists && results.artists.next),
        hasMorePlaylists: !!(results.playlists && results.playlists.next)
      };
    },

    // Scoped to a single type + explicit offset (the running count of items
    // already shown), rather than reusing the combined search's own `next`
    // link — a single-type request is simpler to reason about and matches
    // how the native side tracks "how many of this type do I have so far".
    searchMoreSongs: async function (term, offset) {
      const m = requireMusic();
      const storefront = m.storefrontId || 'us';
      const res = await m.api.music(`/v1/catalog/${storefront}/search`, { term: term, types: 'songs', limit: 25, offset: offset });
      const results = res.data.results || {};
      const data = (results.songs && results.songs.data) || [];
      return {
        items: mapSafely(data, d => mapSongAttributes(d.id, d.attributes, false), 'search song'),
        hasMore: !!(results.songs && results.songs.next)
      };
    },

    searchMoreAlbums: async function (term, offset) {
      const m = requireMusic();
      const storefront = m.storefrontId || 'us';
      const res = await m.api.music(`/v1/catalog/${storefront}/search`, { term: term, types: 'albums', limit: 25, offset: offset });
      const results = res.data.results || {};
      const data = (results.albums && results.albums.data) || [];
      return {
        items: mapSafely(data, d => mapAlbumAttributes(d.id, d.attributes, false), 'search album'),
        hasMore: !!(results.albums && results.albums.next)
      };
    },

    searchMoreArtists: async function (term, offset) {
      const m = requireMusic();
      const storefront = m.storefrontId || 'us';
      const res = await m.api.music(`/v1/catalog/${storefront}/search`, { term: term, types: 'artists', limit: 25, offset: offset });
      const results = res.data.results || {};
      const data = (results.artists && results.artists.data) || [];
      return {
        items: mapSafely(data, d => mapArtistAttributes(d.id, d.attributes), 'search artist'),
        hasMore: !!(results.artists && results.artists.next)
      };
    },

    searchMorePlaylists: async function (term, offset) {
      const m = requireMusic();
      const storefront = m.storefrontId || 'us';
      const res = await m.api.music(`/v1/catalog/${storefront}/search`, { term: term, types: 'playlists', limit: 25, offset: offset });
      const results = res.data.results || {};
      const data = (results.playlists && results.playlists.data) || [];
      return {
        items: mapSafely(data, d => mapPlaylistAttributes(d.id, d.attributes, false), 'search playlist'),
        hasMore: !!(results.playlists && results.playlists.next)
      };
    }
  };
</script>
</body>
</html>
