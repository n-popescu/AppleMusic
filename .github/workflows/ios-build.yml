name: iOS Unsigned Build

# ---------------------------------------------------------------------------
# Builds MusicGlass into an UNSIGNED .ipa suitable for local resigning /
# sideloading (e.g. with a tool like AltStore, or `codesign` + a provisioning
# profile you already have). There are no signing certificates or
# provisioning profiles configured here, and none should be added as repo
# secrets for this workflow — a real App Store / TestFlight distribution
# build needs its own signed workflow with those secrets wired up separately.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main
    # The release job commits apps.json (the SideStore/AltStore source file)
    # straight back to main after every build. Without this, that commit
    # would itself trigger a new push event -> new workflow run -> new
    # apps.json commit -> forever.
    paths-ignore:
      - 'apps.json'
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the release job can create/update the GitHub Release

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest

    env:
      PROJECT_PATH: MusicGlass/MusicGlass.xcodeproj
      SCHEME: MusicGlass
      ARCHIVE_PATH: ${{ github.workspace }}/build/MusicGlass.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      IPA_NAME: Lucent-1.0.0-unsigned.ipa
      # The user-facing version (Settings → Account shows "Version X (build
      # N)", and this is X) auto-bumps every build from here on, the same
      # way CURRENT_PROJECT_VERSION below already did — both are overridden
      # at the xcodebuild command line, never written back to the pbxproj,
      # so there's no extra commit and no drift between what's built and
      # what the project file says. The release tag/filename deliberately
      # stay fixed at v1.0.0/Lucent-1.0.0-unsigned.ipa regardless (see the
      # `release` job below) — that fixed URL is what SideStore/AltStore's
      # source (apps.json) depends on to keep updating in place without
      # anyone re-adding it.
      MARKETING_VERSION: 1.0.${{ github.run_number }}
      # `secrets` can't be referenced in an `if:` expression, only in `env:`/
      # `with:` mappings — so it's promoted to a job-level env var here, and
      # the injection step below checks `env.MUSICKIT_DEVELOPER_TOKEN` instead.
      MUSICKIT_DEVELOPER_TOKEN: ${{ secrets.MUSICKIT_DEVELOPER_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Show available SDKs
        run: xcodebuild -showsdks

      - name: Inject MusicKit developer token from secret
        if: ${{ env.MUSICKIT_DEVELOPER_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "::add-mask::$MUSICKIT_DEVELOPER_TOKEN"
          /usr/libexec/PlistBuddy -c "Set :MusicKitDeveloperToken $MUSICKIT_DEVELOPER_TOKEN" \
            "MusicGlass/MusicGlass/Resources/Info.plist"
          echo "MusicKit developer token injected from the MUSICKIT_DEVELOPER_TOKEN secret."

      - name: Build & archive (unsigned)
        run: |
          set -euo pipefail
          # Both CURRENT_PROJECT_VERSION (-> CFBundleVersion) and
          # MARKETING_VERSION (-> CFBundleShortVersionString) are overridden
          # here to values that change on every run, rather than left at
          # whatever's hardcoded in the pbxproj. Several sideloading tools
          # (AltStore, Sideloadly) key "is this already installed" off both
          # of those together — with either one identical across every
          # release, they can silently skip a real reinstall and leave a
          # stale build's crash (or bug) looking unfixed even after the .ipa
          # itself was rebuilt.
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            clean archive

      - name: Package unsigned .ipa from the .xcarchive
        run: |
          set -euo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/MusicGlass.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected app bundle not found at $APP_PATH"
            find "$ARCHIVE_PATH" -maxdepth 4
            exit 1
          fi

          mkdir -p "$EXPORT_PATH/Payload"
          cp -R "$APP_PATH" "$EXPORT_PATH/Payload/"

          # An .ipa is just a zip of a `Payload/` folder containing the .app.
          # There's no signing identity or provisioning profile available in
          # CI, so this produces an UNSIGNED ipa — it needs to be resigned
          # locally (e.g. via `codesign` + a real provisioning profile, or a
          # sideloading tool) before it can be installed on a device.
          (cd "$EXPORT_PATH" && zip -qry "$IPA_NAME" "Payload")

          mkdir -p "$GITHUB_WORKSPACE/build/output"
          mv "$EXPORT_PATH/$IPA_NAME" "$GITHUB_WORKSPACE/build/output/$IPA_NAME"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lucent-unsigned-ipa
          path: build/output/${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build-unsigned-ipa
    runs-on: ubuntu-latest
    # Only cut/update a release from pushes to main (not PRs, not manual
    # workflow_dispatch runs from other branches) — this reuses the same
    # v1.0.0 tag/release on every push to main; only the app's own version
    # (MARKETING_VERSION, baked in at build time) bumps every run, not the
    # tag/release/filename — see build-unsigned-ipa's env comment for why.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      # Recomputed independently rather than passed as a job output — it's a
      # pure function of github.run_number, which is already identical and
      # available in both jobs of this same workflow run.
      MARKETING_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unsigned IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Lucent-unsigned-ipa
          path: build/output

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Lucent ${{ env.MARKETING_VERSION }}
          body: |
            Automated build of Lucent ${{ env.MARKETING_VERSION }} (build
            ${{ github.run_number }}, commit ${{ github.sha }}) — **unsigned**
            `.ipa`, produced with
            `CODE_SIGNING_ALLOWED=NO` (see `.github/workflows/ios-build.yml`).
            There is no signing certificate or provisioning profile involved in
            this build. Resign it locally (`codesign` + your own provisioning
            profile) or run it through a sideloading tool before installing on
            a device.

            If your sideloading tool shows this as "already installed" after a
            new push, check Settings → General → About → Version on-device: it
            should show build ${{ github.run_number }}. If it still shows an
            older build number, force a full uninstall/reinstall rather than
            an in-place update.

            **SideStore/AltStore users:** add
            `https://raw.githubusercontent.com/n-popescu/AppleMusic/main/apps.json`
            as a source instead of downloading this asset by hand — it always
            points at the latest build and SideStore can refresh from it.
          files: build/output/Lucent-1.0.0-unsigned.ipa

      # Regenerates apps.json (the SideStore/AltStore source file) with this
      # build's real version/date/size, then commits it straight to main so
      # https://raw.githubusercontent.com/.../apps.json always reflects the
      # latest release without a separate manual step. Kept as its own step
      # (rather than folded into the release step above) so a failure here
      # doesn't retroactively undo a release that already published fine.
      - name: Update SideStore/AltStore source (apps.json)
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export IPA_SIZE=$(stat -c%s "build/output/Lucent-1.0.0-unsigned.ipa")
          export BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python3 .github/scripts/update_apps_json.py

          if git diff --quiet -- apps.json; then
            echo "apps.json unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "Update SideStore/AltStore source (build $RUN_NUMBER) [skip ci]"
          git push origin HEAD:main
