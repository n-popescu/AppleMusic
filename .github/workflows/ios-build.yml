name: iOS Unsigned Build

# ---------------------------------------------------------------------------
# Builds MusicGlass into an UNSIGNED .ipa suitable for local resigning /
# sideloading (e.g. with a tool like AltStore, or `codesign` + a provisioning
# profile you already have). There are no signing certificates or
# provisioning profiles configured here, and none should be added as repo
# secrets for this workflow — a real App Store / TestFlight distribution
# build needs its own signed workflow with those secrets wired up separately.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the release job can create/update the GitHub Release

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest

    env:
      PROJECT_PATH: MusicGlass/MusicGlass.xcodeproj
      SCHEME: MusicGlass
      ARCHIVE_PATH: ${{ github.workspace }}/build/MusicGlass.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      IPA_NAME: Lucent-1.0.0-unsigned.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Show available SDKs
        run: xcodebuild -showsdks

      - name: Build & archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean archive

      - name: Package unsigned .ipa from the .xcarchive
        run: |
          set -euo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/MusicGlass.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected app bundle not found at $APP_PATH"
            find "$ARCHIVE_PATH" -maxdepth 4
            exit 1
          fi

          mkdir -p "$EXPORT_PATH/Payload"
          cp -R "$APP_PATH" "$EXPORT_PATH/Payload/"

          # An .ipa is just a zip of a `Payload/` folder containing the .app.
          # There's no signing identity or provisioning profile available in
          # CI, so this produces an UNSIGNED ipa — it needs to be resigned
          # locally (e.g. via `codesign` + a real provisioning profile, or a
          # sideloading tool) before it can be installed on a device.
          (cd "$EXPORT_PATH" && zip -qry "$IPA_NAME" "Payload")

          mkdir -p "$GITHUB_WORKSPACE/build/output"
          mv "$EXPORT_PATH/$IPA_NAME" "$GITHUB_WORKSPACE/build/output/$IPA_NAME"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lucent-unsigned-ipa
          path: build/output/${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build-unsigned-ipa
    runs-on: ubuntu-latest
    # Only cut/update a release from pushes to main (not PRs, not manual
    # workflow_dispatch runs from other branches) — this reuses the same
    # v1.0.0 tag/release on every push to main until the version is bumped.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download unsigned IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Lucent-unsigned-ipa
          path: build/output

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Lucent 1.0.0
          body: |
            Automated build of Lucent 1.0.0 — **unsigned** `.ipa`, produced with
            `CODE_SIGNING_ALLOWED=NO` (see `.github/workflows/ios-build.yml`).
            There is no signing certificate or provisioning profile involved in
            this build. Resign it locally (`codesign` + your own provisioning
            profile) or run it through a sideloading tool before installing on
            a device.
          files: build/output/Lucent-1.0.0-unsigned.ipa
